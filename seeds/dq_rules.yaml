    agent: dq
    approved_by: devansh
    confidence: 0.8
    model: gpt-5-mini
    prompt_version: v1
    proposal_id: 510
  action: flag
  affected_rows: 1576
  column: resolution_notes
  dry_run_error: null
  finding: 'resolution_notes contains many short/uninformative placeholders and blanks: profile top_values include
    '''' = 1575, ''fixed'' = 821, ''done'' = 755 and many templated ''Vendor called...'' strings.'
  implementation: In silver replace trivial placeholders ('fixed','done') with NULL for resolution_notes and add
    a resolution_notes_flag indicating 'placeholder' so analytics ignore them for text-based summaries.
  issue_type: sentinel_values
  predicate: btrim(lower(resolution_notes)) IN ('fixed','done')
  requested_action: null_out
  severity: medium
  why_it_matters: One-word placeholders like 'fixed' or 'done' do not provide root-cause or work-detail needed for
    trend analysis and vendor performance evaluation.
